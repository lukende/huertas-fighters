<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUERTAS FIGHTERS — Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b17;color:#f5e8c9;font-family:monospace;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center}h1{margin:12px 0 3px;color:#f7c553;letter-spacing:5px;text-shadow:3px 3px #a5374b;font-size:clamp(21px,4vw,36px)}.sub{font-size:12px;color:#aab0cc;margin-bottom:14px}#wrap{width:min(96vw,1100px);position:relative;border:5px solid #303653;box-shadow:0 0 0 3px #0b0c17,0 0 30px #5d3c77}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;background:#151c37}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080b1adf;text-align:center;gap:12px}#menu h2{font-size:clamp(22px,5vw,55px);margin:0;color:#ffd26a;text-shadow:4px 4px #8f284f}#menu p{margin:2px 10px;color:#cbd0e2}button{font:700 17px monospace;cursor:pointer;background:#df5363;border:3px solid #ffb66e;color:#fff;padding:10px 20px;box-shadow:4px 4px #662b47}button:hover,button:focus{background:#f87867}.controls{width:min(96vw,1100px);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding:13px 3px;font-size:12px;color:#b8c0d7;line-height:1.7}.controls b{color:#ffe1a3}.mobile{display:none;justify-content:space-between;width:min(96vw,1100px);gap:8px;touch-action:none}.mobile button{padding:9px 13px;font-size:14px;touch-action:none}@media(pointer:coarse){.mobile{display:flex;flex-wrap:wrap}.controls{font-size:11px}}
</style></head><body><h1>HUERTAS FIGHTERS</h1><div class="sub">EDICIÓN ARCADE · PROTOTIPO 02 · JUGABILIDAD</div><div id="wrap"><canvas id="game" width="960" height="540"></canvas><div id="menu"><h2 id="menuTitle">HUERTAS FIGHTERS</h2><p id="menuText">ELIGE TU COMBATE</p><button id="cpu">1 JUGADOR · VS CPU</button><button id="local">2 JUGADORES · LOCAL</button></div></div><div class="controls"><span><b>JUGADOR 1</b> · A/D mover · W saltar · S bloquear · F puño · G patada</span><span><b>JUGADOR 2</b> · ←/→ mover · ↑ saltar · ↓ bloquear · K puño · L patada</span><span><b>ESC</b> menú · <b>R</b> reiniciar combate</span></div><div class="mobile"><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">▲</button><button data-key="s">ESCUDO</button><button data-key="f">PUÑO</button><button data-key="g">PATADA</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),mt=document.getElementById('menuTitle'),mp=document.getElementById('menuText');ctx.imageSmoothingEnabled=false;const W=960,H=540,ground=438,keys=new Set(),pressed=new Set();let mode='cpu',state='menu',p1,p2,round=1,timer=99,clock=0,freeze=0,roundMessage='',roundMessageTimer=0,particles=[],shake=0,last=0,aiTick=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function fighter(x,name,colors,face){return {x,y:ground,vy:0,vx:0,face,hp:100,wins:0,name,colors,onGround:true,block:false,attack:null,attackTime:0,hitDone:false,stun:0,flash:0,walk:0,cool:0,aiDecision:0,aiMove:0,aiGuard:false,aiAttack:null,aiJump:false}}function init(){p1=fighter(270,'KAI',['#1a3863','#4aa6c4','#e9b07e','#e4e8f2'],1);p2=fighter(690,'REX',['#783344','#e56554','#c68a66','#f3d17d'],-1);round=1;timer=99;clock=0;freeze=0;particles=[];state='fight';roundMessage='ROUND 1';roundMessageTimer=1.3;menu.style.display='none';keys.clear();pressed.clear()}
function start(m){mode=m;init()}document.getElementById('cpu').onclick=()=>start('cpu');document.getElementById('local').onclick=()=>start('local');addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k);if(k==='escape'){state='menu';menu.style.display='flex';mt.textContent='HUERTAS FIGHTERS';mp.textContent='ELIGE TU COMBATE'}if(k==='r'&&state!=='menu')start(mode)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
function doAttack(p,type){if(p.attack||p.stun||p.cool||!p.onGround||p.block)return;p.attack=type;p.attackTime=type==='punch'?.28:.42;p.hitDone=false;p.cool=type==='punch'?.18:.28}
function control(p,id,dt){let left,right,jump,block,punch,kick;if(id===1){left=keys.has('a');right=keys.has('d');jump=pressed.has('w');block=keys.has('s');punch=pressed.has('f');kick=pressed.has('g')}else if(mode==='local'){left=keys.has('arrowleft');right=keys.has('arrowright');jump=pressed.has('arrowup');block=keys.has('arrowdown');punch=pressed.has('k');kick=pressed.has('l')}else{const dx=p1.x-p.x,dist=Math.abs(dx);p.aiDecision-=dt;if(p.aiDecision<=0){p.aiDecision=rand(.18,.35);p.aiMove=dist>112?Math.sign(dx):dist<68?-Math.sign(dx):0;p.aiGuard=dist<145&&!!p1.attack&&Math.random()<.75;p.aiAttack=dist<128&&Math.random()<.43?(Math.random()<.58?'punch':'kick'):null;p.aiJump=dist>180&&Math.random()<.045}left=p.aiMove<0;right=p.aiMove>0;block=p.aiGuard&&!!p1.attack;jump=p.aiJump;p.aiJump=false;punch=p.aiAttack==='punch';kick=p.aiAttack==='kick';p.aiAttack=null}p.block=!!block&&p.onGround&&!p.attack&&!p.stun;if(!p.stun){if(!p.attack&&!p.block){p.vx+=( (Number(right)-Number(left))*220-p.vx)*Math.min(1,dt*17);if(jump&&p.onGround){p.vy=-625;p.onGround=false}}else p.vx*=Math.max(0,1-dt*14);if(punch)doAttack(p,'punch');else if(kick)doAttack(p,'kick')}else p.vx*=Math.max(0,1-dt*9)}
function hit(att,def){const range=att.attack==='punch'?104:128;const dx=def.x-att.x;if(Math.abs(dx)>range||Math.abs(def.y-att.y)>72||Math.sign(dx)!==att.face)return;let dmg=att.attack==='punch'?9:14;const blocked=def.block&&def.face===-att.face;dmg=blocked?Math.ceil(dmg*.18):dmg;def.hp=Math.max(0,def.hp-dmg);def.stun=blocked?.09:.24;def.vx=att.face*(blocked?115:265);def.flash=.13;shake=blocked?2:7;for(let i=0;i<(blocked?6:14);i++)particles.push({x:def.x-att.face*16,y:def.y-76,vx:rand(-180,180),vy:rand(-230,90),life:rand(.15,.45),color:blocked?'#76cce9':'#ffe39b'});att.hitDone=true}
function updateF(p,enemy,dt){p.cool=Math.max(0,p.cool-dt);p.stun=Math.max(0,p.stun-dt);p.flash=Math.max(0,p.flash-dt);if(p.attack){p.attackTime-=dt;const threshold=p.attack==='punch'?.17:.24;if(!p.hitDone&&p.attackTime<threshold&&p.attackTime>threshold-.085)hit(p,enemy);if(p.attackTime<=0)p.attack=null}p.vy+=1550*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>=ground){p.y=ground;p.vy=0;p.onGround=true}else p.onGround=false;p.x=clamp(p.x,55,W-55);p.walk+=Math.abs(p.vx)*dt*.055;if(!p.attack&&!p.stun)p.face=enemy.x>=p.x?1:-1}
function nextRound(){if(p1.hp<=0)p2.wins++;else if(p2.hp<=0)p1.wins++;else if(p1.hp>=p2.hp)p1.wins++;else p2.wins++;const winner=p1.hp>=p2.hp?p1:p2;if(p1.wins===2||p2.wins===2){state='end';roundMessage=(p1.wins===2?p1.name:p2.name)+' WINS!';roundMessageTimer=3;setTimeout(()=>{if(state==='end'){menu.style.display='flex';mt.textContent=roundMessage;mp.textContent='¿OTRA PARTIDA?'}},1600)}else{state='between';roundMessage=winner.name+' GANA LA RONDA';roundMessageTimer=1.7;freeze=1.8}}
function update(dt){if(state==='fight'){if(roundMessageTimer>0){roundMessageTimer-=dt;pressed.clear();return}clock+=dt;if(clock>=1){timer=Math.max(0,timer-1);clock-=1}control(p1,1,dt);control(p2,2,dt);updateF(p1,p2,dt);updateF(p2,p1,dt);const gap=Math.abs(p1.x-p2.x);if(gap<68){const dir=p1.x<=p2.x?1:-1,push=(68-gap)/2;p1.x=clamp(p1.x-dir*push,55,W-55);p2.x=clamp(p2.x+dir*push,55,W-55)}if(timer===0||p1.hp===0||p2.hp===0)nextRound()}else if(state==='between'){freeze-=dt;if(freeze<=0){round++;p1.hp=100;p2.hp=100;p1.x=270;p2.x=690;p1.y=p2.y=ground;p1.vx=p2.vx=p1.vy=p2.vy=0;p1.attack=p2.attack=null;p1.stun=p2.stun=0;p1.cool=p2.cool=0;p1.block=p2.block=false;p1.face=1;p2.face=-1;timer=99;clock=0;state='fight';roundMessage='ROUND '+round;roundMessageTimer=1.2}}particles=particles.filter(v=>(v.life-=dt)>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt}shake=Math.max(0,shake-30*dt);pressed.clear()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(s,x,y,size=20,color='#fff',align='center'){ctx.fillStyle='#11142c';ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x+3,y+3);ctx.fillStyle=color;ctx.fillText(s,x,y)}function bg(){rect(0,0,W,H,'#192341');rect(0,0,W,240,'#243451');rect(0,170,W,170,'#e27b6d');rect(0,240,W,110,'#f6a267');rect(720,105,105,105,'#ffcf88');for(let i=0;i<12;i++){let x=i*92-15,h=90+(i*71%135);rect(x,340-h,80,h,'#35405a');for(let j=0;j<6;j++)for(let k=0;k<3;k++)if((i+j+k)%3!==0)rect(x+10+k*21,350-h+j*19,8,10,'#d18b75')}rect(0,340,W,100,'#44445c');for(let i=0;i<9;i++){rect(i*125-25,350,14,88,'#242e49');rect(i*125-25,350,112,10,'#242e49')}rect(0,ground,W,H-ground,'#45465a');rect(0,ground,W,7,'#e1a37e');for(let i=0;i<12;i++){rect(i*90,ground+35,65,4,'#67617a');rect(i*90+40,ground+70,80,4,'#343a52')}rect(400,322,160,38,'#352c4c');text('NEON CITY',480,349,23,'#ffca83');for(let i=0;i<4;i++){rect(50+i*250,382,35,55,'#262b47');rect(62+i*250,368,10,20,'#e1ad7b')}}
function drawF(p){const x=Math.round(p.x),y=Math.round(p.y),s=p.face;ctx.save();ctx.translate(x,y);ctx.scale(s,1);const [dark,main,skin,trim]=p.colors;rect(-29,1,70,9,'#292b41');const walk=Math.sin(p.walk)*7*(p.onGround?1:0);rect(-20,-42+walk,20,43,dark);rect(5,-42-walk,20,43,dark);rect(-24,-7+walk,25,8,trim);rect(4,-7-walk,25,8,trim);rect(-27,-102,56,65,main);rect(-23,-96,48,11,trim);rect(-10,-45,24,10,dark);rect(-19,-146,41,45,skin);rect(-23,-151,48,17,dark);rect(-11,-131,11,6,'#252438');rect(10,-131,10,6,'#252438');rect(-27,-104,55,9,dark);let arm=p.attack==='punch'?53:0;rect(-40,-96,19,48,skin);rect(24,-96,19+arm,-20+48,skin);rect(24,-96,20,14,main);rect(37+arm,-68,17,18,trim);if(p.attack==='kick'){rect(10,-42,75,21,main);rect(76,-44,19,24,trim)}if(p.block){rect(15,-124,22,57,trim);rect(25,-129,17,18,skin)}if(p.flash>0){ctx.globalAlpha=.45;rect(-31,-151,92,155,'#ffffff');ctx.globalAlpha=1}ctx.restore()}
function hud(){rect(0,0,W,85,'#10172ddf');text('KAI',45,31,23,'#81d9ed','left');text('REX',915,31,23,'#ff9e81','right');rect(42,43,365,26,'#3c283f');rect(553,43,365,26,'#3c283f');rect(46,47,357*p1.hp/100,18,p1.hp<25?'#f16464':'#7fe2bb');rect(557+(357*(1-p2.hp/100)),47,357*p2.hp/100,18,p2.hp<25?'#f16464':'#f5a36d');rect(430,12,100,61,'#252640');text(String(timer).padStart(2,'0'),480,58,42,'#ffe3a4');for(let i=0;i<p1.wins;i++)rect(48+i*25,77,18,6,'#f5d577');for(let i=0;i<p2.wins;i++)rect(892-i*25,77,18,6,'#f5d577')}
function render(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));bg();if(p1&&p2){drawF(p1);drawF(p2);hud();for(const p of particles)rect(p.x,p.y,7,7,p.color);if(roundMessageTimer>0||state==='between'||state==='end'){rect(210,198,540,103,'#14172cd9');text(roundMessage,480,262,35,'#ffe09b')}if(state==='fight'&&roundMessageTimer<=0&&timer>0){text(mode==='cpu'?'1P VS CPU':'1P VS 2P',480,518,15,'#b9b4c5')}}ctx.restore()}
function loop(now){const dt=Math.min((now-last)/1000||0,.035);last=now;if(state!=='menu')update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
